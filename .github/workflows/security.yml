name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # Toda segunda-feira

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strivo-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: strivo-app/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de dependências
        run: npm audit --audit-level=high --omit=dev
